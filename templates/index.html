<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Locomize Graph Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }

        h1 {
            font-size: 2.2rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        form {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            margin-top: 20px;
            max-width: 400px;
        }

        input, button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #network {
            width: 100%;
            height: 500px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>

    <!-- vis-network CDN -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>

    <h1>Locomize Graph Editor 🚄</h1>
    <p>Create and visualize your custom railway network.</p>

    <div id="network"></div>

    <h2>➕ Add a New Node</h2>
    <form action="{{ url_for('add_node') }}" method="POST">
        <input type="text" name="node_name" placeholder="e.g. Pune" required>
        <button type="submit">Add Node</button>
    </form>

    <h2>🔗 Add a New Edge</h2>
    <form action="{{ url_for('add_edge') }}" method="POST">
        <input type="text" name="from_node" placeholder="From Node (e.g. Delhi)" required>
        <input type="text" name="to_node" placeholder="To Node (e.g. Jaipur)" required>
        <input type="number" step="0.1" name="weight" placeholder="Distance in KM" required>
        <button type="submit">Add Edge</button>
    </form>

    <!-- Pass graph data to JS -->
    <script>
        const graph = {{ graph | tojson }};
        const nodesSet = new Set();
        const edges = [];

        for (let from in graph) {
            nodesSet.add(from);
            for (let to in graph[from]) {
                nodesSet.add(to);
                edges.push({
                    from: from,
                    to: to,
                    label: graph[from][to].distance + ' km',
                    arrows: 'to'
                });
            }
        }

        const nodes = Array.from(nodesSet).map(node => ({
            id: node,
            label: node
        }));

        const container = document.getElementById('network');
        const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
        const options = {
            nodes: {
                shape: 'dot',
                size: 20,
                font: { size: 16 }
            },
            edges: {
                font: { align: 'top' },
                color: { color: '#3498db' },
                arrows: 'to',
                smooth: true
            },
            physics: {
                enabled: true,
                barnesHut: {
                    gravitationalConstant: -20000,
                    centralGravity: 0.3,
                    springLength: 150
                }
            }
        };
        const network = new vis.Network(container, data, options);
    </script>

</body>
</html>
